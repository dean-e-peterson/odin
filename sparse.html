<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>Sparse Ruler</title>
</head>
<body>
  <header>
    <img src="images/logoDarkWCreamBg.svg"
        height="100" width="100"
        alt="Dean's website logo, just a stylized letters d and p">
    <h1>Sparse Ruler</h1>
  </header>
  <article>
    <p>Here is a page to generate maximal complete <a href="https://en.wikipedia.org/wiki/Sparse_ruler">sparse ruler</a>.</p>
    <label for="length">Length:</label>
    <input id="length" value="4">
    <ul class="ruler">
      <li>0&nbsp;&nbsp;&nbsp;&nbsp;5</li>
      <li>|&nbsp;&nbsp;&nbsp;&nbsp;|</li>
      <li>.. .</li>
      <li>. ..</li>
    </ul>
    <div class="panes">
      <div class="pane">Status 1</div>
      <div class="pane">Status 2</div>
      <div class="pane">Status 3</div>
    </div>
  </article>
  <script src="js/sparse.js"></script>
</body>
</html>
